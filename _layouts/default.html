<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="me" href="https://github.com/{{ site.github_username }}">
  <link rel="me" href="https://www.linkedin.com/in/kritin-sathi-b3a3a9100">
  {%- seo -%}
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22 font-family=%22Georgia,serif%22>K</text></svg>">
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>
      &copy; {{ 'now' | date: "%Y" }} {{ site.author.name }} ·
      <a rel="me" href="https://github.com/{{ site.github_username }}">GitHub</a> ·
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </p>
    <p class="disclaimer">Personal writing. Views are my own and not those of any employer.</p>
  </footer>
</body>
</html>
