title: Kritin Sathi
tagline: Love is the truth
description: >-
  Love is the truth. Listen to understand, be honest and kind together, and
  act from love.
url: "https://kritinsathi.com"
baseurl: ""

author:
  name: Kritin Sathi
  email: kritinsai1@gmail.com

# Used by jekyll-seo-tag for JSON-LD + Twitter/OG cards.
# No `logo:` on purpose: it pointed at an avatar that never existed (404 in the JSON-LD).
social:
  name: Kritin Sathi
  links:
    - https://github.com/Conceptron
    - https://www.linkedin.com/in/kritin-sathi-b3a3a9100

github_username: Conceptron

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

permalink: /:title/

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

feed:
  path: /feed.xml

defaults:
  - scope:
      path: ""
    values:
      # Default share card. A post can override it with its own `image:`.
      image: /assets/og.png
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - .jekyll-cache
