title: Kritin Sathi
tagline: Software engineer in San Francisco
description: >-
  Kritin Sathi, a software engineer in San Francisco.
url: "https://kritinsathi.com"
baseurl: ""

author:
  name: Kritin Sathi
  email: kritinsai1@gmail.com

# Used by jekyll-seo-tag for JSON-LD + Twitter/OG cards.
# No `logo:` on purpose: it pointed at an avatar that never existed (404 in the JSON-LD).
social:
  name: Kritin Sathi
  links:
    - https://github.com/Conceptron
    - https://www.linkedin.com/in/kritin-sathi-b3a3a9100

github_username: Conceptron

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

permalink: /:title/

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

feed:
  path: /feed.xml

defaults:
  # No default share card: assets/og.png still carries the retired
  # "Love is the truth" art (Nov 1 2026). Re-add once a generic card is
  # rendered from writing/og_generic.svg. A post can set its own `image:`.
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - .jekyll-cache
